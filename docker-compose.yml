name: plate-scan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Bootstrap superuser: used only by the init scripts, never by the app.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-platescan}
      # Read by db/init/01-roles.sh.
      DB_OWNER_USER: ${DB_OWNER_USER:-app_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-app_owner_pw}
      DB_APP_USER: ${DB_APP_USER:-app_rw}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app_rw_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-platescan}
      # Runtime role (DML only, subject to RLS)
      DB_USER: ${DB_APP_USER:-app_rw}
      DB_PASSWORD: ${DB_APP_PASSWORD:-app_rw_pw}
      # Owner role, used by entrypoint.sh for migrations only
      DB_OWNER_USER: ${DB_OWNER_USER:-app_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-app_owner_pw}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  pgdata:
